<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>Interactive card details form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-wrapper">
        <div class="card-images">
            <div class="card-back">
                <img src="images/bg-card-back.png" alt="" class="card-back__img">
                <p class="card-back__cvc">000</p>
            </div>
            <div class="card-front">
                <img src="images/bg-card-front.png" alt="" class="card-front__img">
                <div class="card-front__body">
                    <img src="images/card-logo.svg" alt="" class="card-front__logo">
                    <div class="card-front__content">
                        <span class="card-front__numbers">0000 0000 0000 0000</span>
                        <div class="card-front__name-date">
                            <span class="card-front__name">Jane Appleseed</span>
                            <span class="card-front__date"><span class="card-front__month">00</span>/<span class="card-front__year">00</span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-form-success">
            <form class="card-form">
                <div class="card-form__name">
                    <label for="card-name">Cardholder Name</label>
                    <input type="text" placeholder="e.g. Jane Appleseed" id="card-name" maxlength="26" aria-describedby="name-error">
                    <span class="error name-error" id="name-error" role="alert"><span></span></span>
                </div>
                <div class="card-form__numbers">
                    <label for="card-numbers">Card Number</label>
                    <input type="text" inputmode="numeric" placeholder="e.g. 1234 5678 9123 0000" id="card-numbers" maxlength="19" aria-describedby="number-error">
                    <span class="error number-error" id="number-error" role="alert"><span></span></span>
                </div>
                <div class="card-form__date-cvc">
                    <div class="card-form__date">
                        <span id="exp-date-label">Exp. Date (MM/YY)</span>
                        <div class="card-form__date-input">
                            <input type="text" inputmode="numeric" placeholder="MM" id="exp-month" aria-label="Expiration month" maxlength="2" aria-describedby="date-error">
                            <input type="text" inputmode="numeric" placeholder="YY" id="exp-year" aria-label="Expiration year" maxlength="2" aria-describedby="date-error">
                        </div>
                        <span class="error date-error" id="date-error" role="alert"><span></span></span>
                    </div>
                    <div class="card-form__cvc">
                        <label for="card-cvc">CVC</label>
                        <input type="text" inputmode="numeric" placeholder="e.g. 123" id="card-cvc" maxlength="3" aria-describedby="cvc-error">
                        <span class="error cvc-error" id="cvc-error" role="alert"><span></span></span>
                    </div>
                </div>
                <button type="submit" class="card-form__button">Confirm</button>
            </form>
            <div class="card-success hidden">
                <img src="images/icon-complete.svg" alt="Success icon" class="card-success__img">
                <div class="card-success__content">
                    <h1 class="card-success__title">Thank you!</h1>
                    <p class="card-success__text">We've added your card details</p>
                </div>
                <button type="button" class="card-success__button">Continue</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
